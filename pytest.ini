[pytest]
# LittleDungeons test suite — pytest is the primary runner.
# (The stdlib runner still works: `python -m unittest discover -s tests -t .`)
testpaths = tests

# Global per-test timeout (pytest-timeout): a hung test fails after 30s
# instead of hanging CI forever. This replaces the hand-rolled
# daemon-thread watchdogs (docs/reviews/simplification-review.md row 7).
timeout = 30
# method=thread: SIGALRM (the "signal" method) only fires in the main
# thread, and several tests spin ThreadingHTTPServer/WS servers in daemon
# threads — thread-based timers work everywhere and never touch server
# threads.
timeout_method = thread

addopts = -q
