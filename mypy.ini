[mypy]
# Mypy gate for the backend package only.
#
# Scope: run with `.venv/bin/python -m mypy app/` — the `app/` argument
# (and `files = app` below) restricts checking to the backend package;
# tests/ and scripts/ are intentionally out of scope.
#
# This config is intentionally minimal (no strict flags) so the baseline
# error count stays stable; tightening flags is a later stage.

files = app
python_version = 3.14
warn_unused_configs = true

